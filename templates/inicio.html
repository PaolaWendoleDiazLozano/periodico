<!-- templates/inicio.html -->
{% extends "base.html" %}

{% block titulo %}Inicio{% endblock titulo %}

{% block contenido %}
  <div class="p-5 mb-4 bg-body-tertiary rounded-3">
    <h1 class="display-5 fw-bold">Periódico</h1>
    {% if user.is_authenticated %}
      <p class="fs-4">Hola, {{ user.username }}. Qué bueno verte de nuevo.</p>
    {% else %}
      <p class="fs-4">Noticias escritas por nuestra comunidad.</p>
      <a class="btn btn-primary btn-lg" href="{% url 'registro' %}">Crear una cuenta</a>
    {% endif %}
  </div>
{% endblock contenido %}
